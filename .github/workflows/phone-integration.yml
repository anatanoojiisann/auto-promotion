name: Paired phone and content integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phone-source:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
    steps:
      - name: Check private source access configuration
        id: source
        env:
          READ_TOKEN: ${{ secrets.PHONE_PLATFORM_READ_TOKEN }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Private-source paired acceptance runs in the phone-agent-platform repository. This optional duplicate job is skipped until PHONE_PLATFORM_READ_TOKEN is configured." >> "$GITHUB_STEP_SUMMARY"
          fi
  phone-integration:
    needs: phone-source
    if: needs.phone-source.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: promotion
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact paired revision
        id: pair
        working-directory: promotion
        run: |
          python -c 'import json,os; p=json.load(open("docs/integrations/phone-pair.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); print("repository="+p["repository"],file=f); print("commit="+p["commit"],file=f)'
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pair.outputs.repository }}
          ref: ${{ steps.pair.outputs.commit }}
          path: phone
          token: ${{ secrets.PHONE_PLATFORM_READ_TOKEN }}
          persist-credentials: false
      - name: Build independent wheels and run synthetic integration
        working-directory: promotion
        run: python scripts/verify_phone_integration.py --phone-source ../phone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-phone-integration
          path: promotion/.local/phone-integration/**/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-phone-junit
          path: promotion/.local/phone-integration/**/*.xml
