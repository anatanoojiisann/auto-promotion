name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install '.[dev,telegram,mcp]'
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: python -m unittest discover -s tests -v
      - run: python -m build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install '.[browser]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Offline native browser contracts
        run: |
          export AP_BROWSER_EXECUTABLE="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          python -m unittest discover -s tests -p test_browser_contracts.py -v
        env:
          AP_TEST_BROWSER_BACKENDS: '1'
      - run: npm run format:check
      - run: npm run test:ui
        env:
          AUTO_PROMOTION_PYTHON: python
          AP_UI_SKIP_SCREENSHOTS: '1'
      - run: npm run test:ui:pools
        env:
          AUTO_PROMOTION_PYTHON: python

  cloud-control:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/control-plane
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloudflare/control-plane/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  telegram-executor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/telegram-executor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            cloudflare/control-plane/package-lock.json
            cloudflare/telegram-executor/package-lock.json
      - run: npm ci --prefix ../control-plane
      - run: npm ci
      - run: npm test
      - run: npm run check
