<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Auto Promotion · 运营工作台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='none' stroke='%23545be8' stroke-width='2' d='M4 18 12 4l8 14M8 12h8M4 20h16'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/assets/style.css" />
    <script src="/assets/app.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">跳到主要内容</a>
    <aside class="sidebar">
      <a class="brand" href="#tasks"
        ><span class="brand-mark" aria-hidden="true"
          ><svg viewBox="0 0 24 24">
            <path d="M4 18 12 4l8 14M8 12h8M4 20h16" /></svg></span
        ><span>Auto Promotion<small>多平台运营工作台</small></span></a
      >
      <nav aria-label="主导航">
        <a href="#accounts" data-nav="accounts"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21v-2a8 8 0 0 1 16 0v2" /></svg
          >账号中心</a
        >
        <a href="#tasks" data-nav="tasks"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="16" height="17" rx="2" />
            <path d="M8 9h8M8 13h8M8 17h5M9 4V2m6 2V2" /></svg
          >任务中心</a
        >
        <a href="#api" data-nav="api"
          ><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m8 6-6 6 6 6m8-12 6 6-6 6m-3-15-2 18" /></svg
          >API 中心</a
        >
      </nav>
      <div class="sidebar-note">
        <span class="status-dot"></span> 本地工作区
        <p>Telegram · Reddit<br />Instagram · X · Discord</p>
      </div>
      <div class="sidebar-footer">MVP <span>v0.1</span></div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <span id="breadcrumb">工作区 / 任务中心</span>
        <div class="top-actions">
          <span id="write-mode" class="badge">读取状态…</span
          ><button id="global-stop" class="secondary compact">读取开关…</button>
        </div>
      </header>
      <main id="main" tabindex="-1">
        <div class="loading">正在连接本地工作区…</div>
      </main>
      <footer class="footer">
        任务有记录，执行可核验。<span id="worker-state"></span>
      </footer>
    </div>
    <div id="notice" role="status" aria-live="polite"></div>
    <dialog id="panel" aria-labelledby="panel-title">
      <div class="dialog-head">
        <h2 id="panel-title"></h2>
        <button id="close-panel" class="icon-button" aria-label="关闭">
          <svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </div>
      <div id="panel-content"></div>
    </dialog>
  </body>
</html>
